project_name: palm-screen
model_version: 0.1.0
data:
  raw_dir: data/raw
  metadata_csv: data/metadata.csv
  classes:
  - healthy
  - infected
  positive_class: infected
  group_key_priority:
  - tree_id
  - session_id
  - site_id
  phash_pseudo_groups: true
  phash_group_distance: 6
  allow_image_level_split: true
  holdout_column: null
  holdout_values: []
split:
  test_fraction: 0.2
  n_folds: 5
  seed: 1337
  manifest_dir: artifacts/splits
train:
  arch: efficientnet_b0
  image_size: 224
  batch_size: 16
  num_workers: 2
  head_epochs: 6
  finetune_epochs: 25
  lr_head: 0.001
  lr_backbone: 0.0001
  weight_decay: 0.0001
  label_smoothing: 0.0
  unfreeze_last_n_blocks: 3
  freeze_batchnorm: true
  early_stopping_metric: val_pr_auc
  early_stopping_patience: 6
  early_stopping_min_delta: 0.0001
  grad_clip_norm: 1.0
  use_class_weights: false
  amp: false
  seed: 1337
  checkpoint_dir: artifacts/checkpoints
  augmentation:
    random_resized_crop: true
    crop_scale_min: 0.8
    crop_scale_max: 1.0
    rotation_degrees: 12
    horizontal_flip: true
    vertical_flip: false
    brightness: 0.15
    contrast: 0.15
    saturation: 0.1
    hue: 0.02
    mixup: false
    cutmix: false
threshold:
  policy: max_specificity_at_recall
  target_recall: 0.9
  fixed_threshold: 0.5
  review_band: 0.1
calibration:
  method: platt
report:
  output_dir: reports
  bootstrap_iterations: 2000
  ece_bins: 10
  prevalence_grid:
  - 0.01
  - 0.05
  - 0.1
  - 0.25
  - 0.5
